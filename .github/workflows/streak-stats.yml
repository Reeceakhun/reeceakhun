name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"   # runs daily at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml"  # also runs if you edit this file
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  update-streak-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate streak stats image
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          user_id: Reeceakhun
          exclude_days: ""
          theme: tokyonight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}ls
          